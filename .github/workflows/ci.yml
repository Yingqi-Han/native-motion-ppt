name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_timeline.mjs
      - run: python scripts/validate_skill.py
      - run: python scripts/package_skill.py --source-only --out dist
      - run: python scripts/verify_delivery.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: installable-skill
          path: dist/
